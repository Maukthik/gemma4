# Root coding agent. Schema: adk_submission SandboxedLlmAgentConfig.
#  - tools: plain registry names (strings) or `agent_tool: {config_path: ...}` entries
#  - skills: paths to skill directories inside the submission
#  - instruction is ADK-templated: {problem_description} is filled from session state.
#    Never put any other {word} in prompts/*.md (an unknown key raises at runtime).
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
# adapter: main_lora          # enable once adapters/main_lora/ is trained and validated
description: Autonomous software engineer that fixes Python repository issues with minimal, verified patches.
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - search_similar_code
  - get_code_neighbors
  - get_status
  - submit_patch
  # Optional read-only localisation helper (costs time; A/B before enabling):
  # - agent_tool:
  #     config_path: sub_agents/code_analyzer.yaml
  #     skip_summarization: false
skills:
  - skills/repo-navigation
  - skills/verify-fix
