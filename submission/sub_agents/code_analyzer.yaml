# Read-only localisation helper, exposed to the root agent via AgentTool.
name: code_analyzer
agent_class: LlmAgent
model: gemma-4-31b-it-qat-w4a16-ct
# adapter: tool_lora          # optional separate adapter for the analyzer
description: >-
  Read-only analyst. Given a precise question about the repository in
  /workspace, returns the files, line numbers and symbols that matter plus the
  likely minimal fix. Never edits files.
instruction: !include ../prompts/analyzer.md
generate_content_config:
  temperature: 0.2
  top_p: 0.95
  max_output_tokens: 2048
tools:
  - name: run_command
  - name: read_file
  - name: search_similar_code
  - name: get_code_neighbors
  - name: get_code_subgraph
